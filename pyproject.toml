[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iSincNet"
version = "1.0.0"
authors = [{ name = "Williams Zanga", email = "zanga.williams@gmail.com" }]
description = "Fast Lightweight invertible SincNet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch", "numpy", "librosa"]

[project.optional-dependencies]
demo = ["matplotlib", "soundfile"]
dev = ["pytest"]

[tool.setuptools]
packages = ["sincnet"]

[project.urls]
"Homepage" = "https://github.com/wkzng/iSincNet"
